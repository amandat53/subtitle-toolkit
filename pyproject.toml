[project]
name = "subtl"
version = "0.1.0"
description = "A small library and CLI for working with .srt subtitle files"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
subtl = "subtl.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
